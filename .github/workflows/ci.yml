name: AgentStation CI/CD Verification

on:
  push:
    branches: [ main, develop, 'feat/**', 'fix/**', 'release/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    name: Build, Lint & Automated Tests

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Type Check and Lint
        run: npm run lint

      - name: Compile and Build Applet
        run: npm run build

      - name: Set up Python for Mission Sandboxes
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run Test Suite Verification
        run: |
          if [ -d "tests" ] && [ "$(ls -A tests 2>/dev/null)" ]; then
            pytest -v tests/
          else
            echo "No test files found; verification skipped."
          fi

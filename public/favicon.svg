<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="favHex" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="favCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>
  <!-- Background Disc -->
  <rect width="64" height="64" rx="14" fill="#090d16" />
  <rect width="62" height="62" x="1" y="1" rx="13" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.5" />
  
  <!-- Outer Hexagon Station Frame -->
  <polygon 
    points="32,12 49,22 49,42 32,52 15,42 15,22" 
    fill="#0f172a" 
    stroke="url(#favHex)" 
    stroke-width="2.5" 
    stroke-linejoin="round"
  />

  <!-- Internal Radiating Traces -->
  <line x1="32" y1="12" x2="32" y2="25" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <line x1="49" y1="42" x2="38" y2="35" stroke="#818cf8" stroke-width="2" stroke-linecap="round" />
  <line x1="15" y1="42" x2="26" y2="35" stroke="#34d399" stroke-width="2" stroke-linecap="round" />

  <!-- Station Core -->
  <polygon 
    points="32,25 39,32 32,39 25,32" 
    fill="url(#favCore)" 
    stroke="#93c5fd" 
    stroke-width="1.5" 
  />
  <circle cx="32" cy="32" r="2.5" fill="#ffffff" />

  <!-- Node Dots -->
  <circle cx="32" cy="12" r="2.5" fill="#38bdf8" />
  <circle cx="49" cy="22" r="2" fill="#60a5fa" />
  <circle cx="49" cy="42" r="2.5" fill="#a78bfa" />
  <circle cx="32" cy="52" r="2" fill="#f472b6" />
  <circle cx="15" cy="42" r="2.5" fill="#34d399" />
  <circle cx="15" cy="22" r="2" fill="#2dd4bf" />
</svg>
